<div class="container mx-auto mt-5">

      Witaj {{userData.name}} <span *ngIf="userData.roles">({{userData.roles}})</span>
    </h3>
    <p-button label="Sprzęt" [routerLink]="['./sprzet']" icon="pi pi-briefcase" class="mr-1"></p-button>
    <p-button label="Klienci" [routerLink]="['./klienci']" icon="pi pi-users" class="mr-1"></p-button>
    <p-button label="Wypożyczenia" [routerLink]="['./wypozyczenia']" icon="pi pi-book"></p-button>
  </p-card>
</div>
