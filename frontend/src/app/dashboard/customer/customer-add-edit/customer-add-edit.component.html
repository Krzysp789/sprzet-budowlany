<form (ngSubmit)="onSubmit(form)" #form="ngForm" class="space-y-6">
  <div class="flex flex-col">
    <label for="first_name" class="mb-2">Imię</label>

    <input type="text" pInputText id="first_name" [(ngModel)]="customer.first_name" name="first_name"
      #first_name="ngModel" required maxlength="45" />

    <app-control-error [control]="first_name.control" [submitted]="form.submitted" name="imię">
    </app-control-error>
  </div>

  <div class="flex flex-col">
    <label for="last_name" class="mb-2">Nazwisko</label>

    <input type="text" pInputText id="last_name" [(ngModel)]="customer.last_name" name="last_name" #last_name="ngModel"
      required maxlength="45" />

    <app-control-error [control]="last_name.control" [submitted]="form.submitted" name="nazwisko">
    </app-control-error>
  </div>

  <div class="flex flex-col">
    <label for="phone_no" class="mb-2">Nr telefonu</label>

    <input type="text" pInputText id="phone_no" [(ngModel)]="customer.phone_no" name="phone_no" #phone_no="ngModel"
      required pattern="^[+]\d{1,3}[ ]\d{9}$|^\d{9}$" />

    <app-control-error [control]="phone_no.control" [submitted]="form.submitted" name="nr telefonu">
    </app-control-error>
  </div>

  <div class="flex flex-col">
    <label for="email" class="mb-2">Email</label>

    <input type="email" pInputText id="email" [(ngModel)]="customer.email" name="email" #email="ngModel" required email
      maxlength="45" />

    <app-control-error [control]="email.control" [submitted]="form.submitted" name="email">
    </app-control-error>
  </div>

  <div class="flex flex-col">
    <label for="notes" class="mb-2">Opis</label>

    <textarea rows="5" pInputTextarea id="notes" [(ngModel)]="customer.notes" name="notes" #notes="ngModel"
      maxlength="255"></textarea>

    <app-control-error [control]="notes.control" [submitted]="form.submitted" name="opis">
    </app-control-error>
  </div>

  <div class="flex justify-end">
    <p-button type="submit" label="Dodaj" *ngIf="!edit"></p-button>
    <p-button type="submit" label="Aktualizuj" *ngIf="edit"></p-button>
  </div>
</form>
