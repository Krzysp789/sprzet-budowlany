<p-card styleClass="w-96 mx-2">
  <a href="" class="w-32 flex flex-col mx-auto mb-5">
    <img src="/assets/images/koparka.svg" width="100%" class="" />
    <span class="self-center text-xl font-semibold whitespace-nowrap">Sprzęt budowlany</span>
  </a>

  <div class="card">
    <p-messages [(value)]="messages" [enableService]="false" [closable]="true"></p-messages>
  </div>

  <span class="p-card-title">Rejestracja</span>

  <form (ngSubmit)="submit()" [formGroup]="registerForm" #form="ngForm" class="mt-2">
    <div class="mb-6 flex flex-col">
      <label for="name" class="mb-2">Nazwa</label>

      <input type="text" pInputText id="name" formControlName="name">

      <app-control-error [control]="registerForm.controls['name']" [submitted]="form.submitted" name="nazwa">
      </app-control-error>
    </div>

    <div class="mb-6 flex flex-col">
      <label for="email" class="mb-2">Email</label>

      <input type="email" pInputText id="email" formControlName="email">

      <app-control-error [control]="registerForm.controls['email']" [submitted]="form.submitted" name="email">
      </app-control-error>
    </div>

    <div class="mb-6 flex flex-col">
      <label for="password" class="mb-2">Hasło</label>

      <input type="password" pInputText id="password" formControlName="password">

      <app-control-error [control]="registerForm.controls['password']" [submitted]="form.submitted" name="hasło">
      </app-control-error>
    </div>

    <div class="mb-6 flex flex-col">
      <label for="confirm_password" class="mb-2">Powtórz hasło</label>
      <input type="password" pInputText id="confirm_password" formControlName="confirmPassword">

      <app-control-error [control]="registerForm.controls['confirmPassword']" [submitted]="form.submitted"
        name="powtórz hasło">
      </app-control-error>
    </div>

    <div class="mb-6 flex flex-col">
      <label for="first_name" class="mb-2">Imię</label>

      <input type="text" pInputText id="first_name" formControlName="first_name">

      <app-control-error [control]="registerForm.controls['first_name']" [submitted]="form.submitted" name="imię">
      </app-control-error>
    </div>

    <div class="mb-6 flex flex-col">
      <label for="last_name" class="mb-2">Nazwisko</label>

      <input type="text" pInputText id="last_name" formControlName="last_name">

      <app-control-error [control]="registerForm.controls['last_name']" [submitted]="form.submitted" name="nazwisko">
      </app-control-error>
    </div>

    <div class="mb-6 flex flex-col">
      <label for="phone_no" class="mb-2">Telefon</label>

      <input type="text" pInputText id="phone_no" formControlName="phone_no">

      <app-control-error [control]="registerForm.controls['phone_no']" [submitted]="form.submitted" name="telefon">
      </app-control-error>
    </div>

    <p-button type="submit" label="Zarejestruj"></p-button>
  </form>
</p-card>
