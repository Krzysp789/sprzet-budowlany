<p-card styleClass="w-96">
  <a href="" class="w-32 flex flex-col mx-auto mb-5">
    <img src="/assets/images/koparka.svg" width="100%" class="" />
    <span class="self-center text-xl font-semibold whitespace-nowrap mt-2">Sprzęt budowlany</span>
  </a>

  <div class="card">
    <p-messages [(value)]="messages" [enableService]="false" [closable]="true"></p-messages>
  </div>

  <span class="p-card-title">Logowanie</span>

  <form (ngSubmit)="submit()" [formGroup]="loginForm" #form="ngForm" class="mt-2">
    <div class="mb-6 flex flex-col">
      <label for="email" class="mb-2">Email</label>

      <input type="email" pInputText id="email" formControlName="email">

      <app-control-error [control]="loginForm.controls['email']" [submitted]="form.submitted" name="email">
      </app-control-error>
    </div>

    <div class="mb-6 flex flex-col">
      <label for="password" class="mb-2">Hasło</label>

      <input type="password" pInputText id="password" formControlName="password">

      <app-control-error [control]="loginForm.controls['password']" [submitted]="form.submitted" name="hasło">
      </app-control-error>
    </div>

    <p-button type="submit" label="Zajoguj"></p-button>
  </form>
</p-card>
